<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CKYC // DECRYPT ENGINE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
  :root {
    --bg: #030508; --panel: rgba(10, 16, 24, 0.65); --line: rgba(255, 255, 255, 0.08);
    --accent: #00ff9c; --accent-dim: rgba(0, 255, 156, 0.15); --accent-glow: rgba(0, 255, 156, 0.4);
    --text: #e2f5eb; --muted: #6b8293; --danger: #ff3355;
    --font-main: 'Plus Jakarta Sans', sans-serif; --font-code: 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background-color: var(--bg); color: var(--text); font-family: var(--font-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; position: relative; }
  .ambient-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(circle at 15% 50%, rgba(0, 255, 156, 0.04) 0%, transparent 40%), radial-gradient(circle at 85% 30%, rgba(0, 200, 255, 0.03) 0%, transparent 40%), linear-gradient(180deg, #05080c 0%, #030508 100%); }
  .noise { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
  .wrapper { position: relative; z-index: 10; width: 100%; max-width: 880px; padding: 40px 24px; display: flex; flex-direction: column; gap: 28px; }
  header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .logo-area { display: flex; align-items: center; gap: 16px; }
  .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--accent), #00b36b); border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #000; box-shadow: 0 0 20px var(--accent-glow); }
  .logo-text h1 { font-size: 18px; font-weight: 800; letter-spacing: 1px; }
  .logo-text p { font-size: 11px; color: var(--accent); font-family: var(--font-code); letter-spacing: 2px; margin-top: 2px; }
  .sys-status { font-family: var(--font-code); font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.3); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--line); }
  .sys-status span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 2s infinite; }
  .card { background: var(--panel); backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 24px; padding: 32px; box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05); position: relative; overflow: hidden; }
  .hero { text-align: center; margin-bottom: 36px; }
  .hero h2 { font-size: clamp(28px, 4vw, 38px); font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; }
  .hero h2 span { color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }
  .hero p { color: var(--muted); font-size: 14px; max-width: 500px; margin: 0 auto; line-height: 1.6; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .action-btn { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; align-items: center; gap: 18px; cursor: pointer; transition: 0.3s; text-align: left; color: var(--text); }
  .action-btn:hover { background: rgba(0, 255, 156, 0.04); border-color: rgba(0, 255, 156, 0.4); transform: translateY(-2px); }
  .action-icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(0, 255, 156, 0.1); border: 1px solid rgba(0, 255, 156, 0.2); display: grid; place-items: center; color: var(--accent); font-size: 20px; }
  .action-text h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .action-text p { font-size: 12px; color: var(--muted); font-family: var(--font-code); }
  .back-btn { background: none; border: none; color: var(--muted); font-family: var(--font-code); font-size: 12px; cursor: pointer; margin-bottom: 20px; }
  .back-btn:hover { color: var(--accent); }
  .input-group { display: flex; gap: 12px; }
  input[type="text"] { flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; color: var(--text); font-family: var(--font-code); font-size: 13px; outline: none; }
  .submit-btn { background: var(--accent); color: #000; border: none; border-radius: 12px; padding: 0 28px; font-weight: 800; font-size: 13px; cursor: pointer; }
  .drop-zone { border: 2px dashed rgba(0, 255, 156, 0.2); border-radius: 16px; padding: 48px 20px; text-align: center; cursor: pointer; transition: 0.3s; }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(0, 255, 156, 0.05); }
  .drop-icon { font-size: 40px; color: var(--accent); margin-bottom: 16px; }
  .progress-header { display: flex; justify-content: space-between; font-family: var(--font-code); font-size: 12px; margin-bottom: 12px; color: var(--muted); }
  .bar-bg { height: 8px; background: rgba(0, 0, 0, 0.5); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00b36b, var(--accent), #00e5ff); transition: width 0.2s; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
  .stat-box { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: center; }
  .stat-box p { font-family: var(--font-code); font-size: 10px; color: var(--muted); margin-bottom: 8px; }
  .stat-box h4 { font-family: var(--font-code); font-size: 16px; color: var(--text); }
  .terminal { background: #010306; border: 1px solid var(--line); border-radius: 12px; padding: 16px; height: 140px; overflow-y: auto; font-family: var(--font-code); font-size: 11px; line-height: 1.8; margin-top: 20px; }
  .result-box { text-align: center; padding: 20px 0; }
  .result-icon { width: 72px; height: 72px; border-radius: 50%; background: rgba(0, 255, 156, 0.1); border: 1px solid var(--accent); display: grid; place-items: center; margin: 0 auto 20px; font-size: 32px; color: var(--accent); }
  .pass-display { display: inline-block; background: rgba(0, 255, 156, 0.08); border: 1px solid var(--accent-dim); padding: 16px 32px; border-radius: 12px; font-family: var(--font-code); font-size: 24px; color: var(--accent); letter-spacing: 4px; margin-bottom: 24px; }
  .dl-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: #000; padding: 16px 32px; border-radius: 12px; font-weight: 800; font-size: 14px; text-decoration: none; }
  .hidden { display: none !important; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .fade-in { animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="ambient-bg"></div>
<div class="noise"></div>
<div class="wrapper">
  <header>
    <div class="logo-area">
      <div class="logo-icon">C</div>
      <div class="logo-text"><h1>CKYC//DECRYPT</h1><p>ENGINE V5.0</p></div>
    </div>
    <div class="sys-status"><span></span> SYSTEM ONLINE</div>
  </header>

  <div class="card">
    <div id="view-menu" class="fade-in">
      <div class="hero">
        <h2>Unlock <span>CKYC Cards</span></h2>
        <p>High-speed server-side decryption. Password format DDMMYYYY.</p>
      </div>
      <div class="btn-grid">
        <button class="action-btn" id="btn-link">
          <div class="action-icon">⌘</div>
          <div class="action-text"><h3>SEND LINK</h3><p>Paste CKYC URL</p></div>
        </button>
        <button class="action-btn" id="btn-upload">
          <div class="action-icon">▤</div>
          <div class="action-text"><h3>UPLOAD PDF</h3><p>Local encrypted file</p></div>
        </button>
      </div>
    </div>

    <div id="view-link" class="hidden fade-in">
      <button class="back-btn" data-back>← BACK TO MENU</button>
      <div class="input-group">
        <input type="text" id="link-input" placeholder="https://www.ckycindia.in/kyc/dc?..." />
        <button class="submit-btn" id="btn-fetch">FETCH</button>
      </div>
    </div>

    <div id="view-upload" class="hidden fade-in">
      <button class="back-btn" data-back>← BACK TO MENU</button>
      <div class="drop-zone" id="drop">
        <div class="drop-icon">▤</div>
        <h3>Drop Encrypted PDF here</h3>
        <p>or click to browse · .pdf only</p>
      </div>
      <input type="file" id="file-input" accept="application/pdf,.pdf" class="hidden" />
    </div>

    <div id="view-progress" class="hidden fade-in">
      <div class="progress-header"><span id="p-label">PROCESSING...</span><span id="p-pct">0.0%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="p-fill"></div></div>
      <div class="stats-grid">
        <div class="stat-box"><p>STATUS</p><h4 id="s-status">Wait</h4></div>
        <div class="stat-box"><p>SPEED</p><h4 id="s-rate">—</h4></div>
        <div class="stat-box"><p>ETA</p><h4 id="s-eta">—</h4></div>
      </div>
      <div class="terminal" id="log"></div>
    </div>

    <div id="view-result" class="hidden fade-in">
      <div class="result-box" id="result-body"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const views = ['menu', 'link', 'upload', 'progress', 'result'];
function show(v) { views.forEach(n => $('#view-' + n).classList.toggle('hidden', n !== v)); }
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => show('menu'));
$('#btn-link').onclick = () => show('link');
$('#btn-upload').onclick = () => show('upload');

const logEl = $('#log');
function log(msg, cls = 'dim') {
  const d = document.createElement('div');
  d.className = cls; d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}

function renderResult(pw, err, url) {
  show('result');
  const body = $('#result-body');
  if (!pw) {
    body.innerHTML = `<div class="result-icon" style="border-color:var(--danger);color:var(--danger)">✕</div>
      <h3>DECRYPTION FAILED</h3><p style="color:var(--danger);font-family:var(--font-code);font-size:13px;margin-bottom:24px;">${err}</p>
      <button class="back-btn" onclick="location.reload()">← RESTART ENGINE</button>`;
    return;
  }
  body.innerHTML = `<div class="result-icon">✓</div><h3>DECRYPTION SUCCESSFUL</h3>
    <div class="pass-display"><small>PASSWORD</small>${pw}</div><br/>
    <a class="dl-btn" href="${url}" download="ckyc_decrypted.pdf">⬇ DOWNLOAD PDF</a>
    <div style="margin-top:24px;"><button class="back-btn" onclick="location.reload()">← RESTART ENGINE</button></div>`;
}

async function processAPI(action, payload) {
  show('progress');
  logEl.innerHTML = '';
  log('Connecting to decryption server...', 'ok');
  
  $('#p-label').textContent = 'UPLOADING...';
  $('#p-fill').style.width = '30%';

  try {
    const res = await fetch(action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();

    $('#p-fill').style.width = '100%';
    $('#p-label').textContent = 'DONE';
    
    if (data.success) {
      log('Decryption successful!', 'ok');
      renderResult(data.password, null, data.file_data);
    } else {
      log(data.error || 'Failed', 'err');
      renderResult(null, data.error || 'Decryption failed on server.');
    }
  } catch (err) {
    log('Connection error: ' + err.message, 'err');
    renderResult(null, 'Network error: ' + err.message);
  }
}

$('#btn-fetch').onclick = () => {
  const url = $('#link-input').value.trim();
  if (!url.match(/https?:\/\/.*ckycindia\.in/)) return alert('Invalid CKYC URL');
  processAPI('/api/decrypt', { url });
};

const drop = $('#drop'), fileInput = $('#file-input');
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('dragover'); };
drop.ondragleave = () => drop.classList.remove('dragover');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('dragover'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
fileInput.onchange = () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); };

async function handleFile(file) {
  if (!file.name.endsWith('.pdf')) return alert('Only PDF files allowed');
  show('progress');
  logEl.innerHTML = '';
  log('Reading local PDF file...', 'ok');
  $('#p-label').textContent = 'CONVERTING...';
  $('#p-fill').style.width = '20%';

  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result.split(',')[1];
    processAPI('/api/decrypt', { file_base64: base64 });
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
